<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uploads · Acme Drive</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Acme Drive</a>
  <nav class="topnav"><a href="/files">Files</a> <a href="/shared">Shared</a></nav>
</header>
<main class="page">
  <h1>Uploads</h1>
  <ul class="file-list">
    <li class="file-row">
      <span class="file-icon" aria-hidden="true">PDF</span>
      <div class="file-info">
        <p class="file-name">Q3_board_pack_FINAL_v7_with_appendix_reviewed_by_Ana_and_Ben.pdf</p>
        <p class="file-meta">2.4 MB · uploaded by Ana</p>
      </div>
      <div class="file-actions">
        <button class="icon-btn" type="button" aria-label="Download">&#8595;</button>
        <button class="icon-btn icon-btn--danger" type="button" aria-label="Delete">&#215;</button>
      </div>
    </li>
    <li class="file-row">
      <span class="file-icon" aria-hidden="true">XLS</span>
      <div class="file-info">
        <p class="file-name">budget.xlsx</p>
        <p class="file-meta">88 KB · uploaded by Ben</p>
      </div>
      <div class="file-actions">
        <button class="icon-btn" type="button" aria-label="Download">&#8595;</button>
        <button class="icon-btn icon-btn--danger" type="button" aria-label="Delete">&#215;</button>
      </div>
    </li>
    <li class="file-row">
      <span class="file-icon" aria-hidden="true">PNG</span>
      <div class="file-info">
        <p class="file-name">logo.png</p>
        <p class="file-meta">12 KB · uploaded by Ana</p>
      </div>
      <div class="file-actions">
        <button class="icon-btn" type="button" aria-label="Download">&#8595;</button>
        <button class="icon-btn icon-btn--danger" type="button" aria-label="Delete">&#215;</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
