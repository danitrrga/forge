<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project settings · Acme Console</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/button.css">
<link rel="stylesheet" href="../components/card.css">
<link rel="stylesheet" href="../components/badge.css">
<link rel="stylesheet" href="../components/field.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="page">
  <h1 class="page__title">Project settings <span class="badge badge--success">Active</span></h1>

  <section class="card" aria-labelledby="general-title">
    <h2 class="card__title" id="general-title">General</h2>
    <form>
      <div class="field">
        <label class="field__label" for="project-name">Project name</label>
        <input class="field__input" id="project-name" name="name" value="Northwind analytics">
      </div>
      <div class="card__actions">
        <button class="btn btn--primary" type="submit">Save changes</button>
        <button class="btn btn--secondary" type="reset">Cancel</button>
      </div>
    </form>
  </section>

  <section class="card card--danger" aria-labelledby="danger-title">
    <h2 class="card__title" id="danger-title">Danger zone</h2>
    <p class="card__text">Deleting the project removes its dashboards, data sources and history for everyone. This cannot be undone.</p>
    <div class="card__actions">
    </div>
  </section>
</main>
</body>
</html>
