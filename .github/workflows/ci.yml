# The engine's checks on every push and pull request. They run on a bare runner: no private deny
# file (config/publish-deny.txt, so check-public applies the public list alone), no credentials,
# and a toy HOME that the fresh-install test builds for itself.
# One job, so branch protection has a single check to require; the second step runs even when the
# first fails, so one run reports both.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check-public
        run: python3 bin/forge check-public --all
      - name: fresh install
        if: ${{ !cancelled() }}
        run: python3 tests/test_fresh_install.py
