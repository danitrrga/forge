name: Project checks

# The engine's checks, called by ci.yml's `project` job. They run on a bare runner: no private deny
# file (config/publish-deny.txt, so lint applies the public list alone), no credentials,
# and a toy HOME that the fresh-install test builds for itself.
# Add jobs here, not in ci.yml: every job in this file is already inside "All checks". No trigger
# but workflow_call and workflow_dispatch, and no top-level `concurrency` (ci.yml owns both).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which of the two long suites below (`fwx`, `suite`) this run needs, from the paths a pull request changes
  # (.github/scripts/select_suites.py, its rules and their reasons are in that file, its cases in tests/test_select_suites.py).
  # A push to the default branch, a manual run and any path nobody listed select both, so the only run that gets narrower is a
  # pull request that changes documentation or one side of the engine. `engine` and ci.yml's jobs never wait for it.
  # A suite skipped here is a skipped job: ci.yml's `project` job counts it as passed, and `All checks` goes red only for a job
  # that ran and failed, or for this job failing (its dependants are skipped and `project` fails). A suite is skipped only when
  # its output is the word `false`: an output that is empty or missing (a script that wrote nothing) runs it.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fwx: ${{ steps.select.outputs.fwx }}
      suite: ${{ steps.select.outputs.suite }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff runs from the merge base, which a one-commit checkout does not have
      - name: select the suites
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # No pipe into tee: a pipe without pipefail would hide a failing script behind tee's exit code.
          python3 .github/scripts/select_suites.py --event "$EVENT" --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/select.txt"
          cat "$RUNNER_TEMP/select.txt"
          { echo '### Suites selected'; echo '```'; cat "$RUNNER_TEMP/select.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Always runs, whatever the pull request changes: lint reads every file (the documentation too), and the three tests after it are
  # the ones that read README.md and CLAUDE.md or scan every tracked file, which is why a change to those files may skip the long
  # suites (DOC_READERS in select_suites.py; tests/test_select_suites.py checks the lists agree). A few seconds each, 25 s in all.
  # Full history, because tests/test_readme.py asks git whether a branch it names is merged and prints NOT RUN, NOT ARMED (exit 77)
  # on a one-commit checkout.
  engine:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: lint
        run: python3 bin/forge lint --all
      # Each of the next steps runs even when an earlier one fails, so one run reports all of them.
      - name: fresh install
        if: ${{ !cancelled() }}
        run: python3 tests/test_fresh_install.py
      - name: documentation reader, README and CLAUDE.md claims
        if: ${{ !cancelled() }}
        run: python3 tests/test_readme.py
      - name: documentation reader, old registry names in tracked files
        if: ${{ !cancelled() }}
        run: python3 tests/test_registry_names.py
      - name: documentation reader, the README quick-start
        if: ${{ !cancelled() }}
        run: python3 tests/test_measure_login.py

  # fwx, the framework imported under plugins/fwx, is the `fwx` group of `forge test` (49 test files, 1605 s of file time at 4 at once,
  # 403 s median on one runner: the long pole of a run that does not change the engine);
  # `forge test` with no group leaves them out, so this job is where they run in CI. It runs as 3 shards on 3 runners (`--shard I/N`: the
  # files are dealt one by one, FWX_SLOW_FIRST first, then the largest; test_walk, test_execute_workflow and test_ui_walk_workflow, 461 s,
  # 332 s and 200 s on one runner, are pinned first so that each lands in its own shard, which tests/test_test_shard.py checks. The test
  # declared below can land in a shard of its own, which is not a failure: only a whole run that passed nothing is). tests/test_test_shard.py checks that the entries of `shard` are exactly 1/N .. N/N and that the
  # shards of a suite are every file once. `forge test fwx` exits 1 when no test
  # file ran (and when the plugin folder is missing and a path is declared, as here) and 77 when none failed but one could
  # not run, so an empty or unarmed suite is red here, not falsely green. The test below can never run in CI, and is
  # declared so: it prints `EXPECTED NOT RUN` with its reason and does not turn the exit to 77. Any other test that cannot
  # run is still 77, so still red. The paths are relative to plugins/fwx, as the group lists them.
  #   tests/test_linear_live.py: asks the real Linear API and has no LINEAR_API_KEY here (a secret this job
  #     is not given).
  fwx:
    name: fwx tests (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.fwx != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # one run shows every shard's failures, not the first one's
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 bin/forge test fwx --shard ${{ matrix.shard }} --expect-not-run tests/test_linear_live.py

  # The engine's own suite, `python3 bin/forge test`: every tracked test_*.py but plugins/fwx's (that group is the `fwx` job above)
  # and the on-demand guard mutants, 4 files at once (the runner has 4 CPUs; 89 files: about 25 minutes one after the other, 532 s median
  # at 4 at once on one runner, 3141 s of file time: the CPUs are the limit, more files at once cannot help). It runs as 4 shards on 4
  # runners (`--shard I/N`): test_run, test_switch, test_messages and test_new, the four slow files (SLOW_FIRST in forge/cli.py), are
  # dealt first, one to each shard, and each runs its own mutants 4 at a time.
  # Before this job the suite ran only on the owner's machine, so a pull request that broke tests/test_profiles.py showed green.
  # A test that exits 77 is a WARN `NOT RUN, NOT ARMED`: it does not fail the run, so the list is kept here, and a new
  # one is to be read in the log. Three tests run `unshare -rn` (test_write_guard, test_sync_fixture, test_relink_skills): Ubuntu 24.04
  # runners refuse that to an unprivileged user, so the first step lifts the restriction for this job's VM (only).
  # The one WARN line left, a thing this runner lacks (tests/test_new.py is armed by the full-history checkout below):
  #   tests/test_shim.py: the fish and zsh cases need those shells, which the runner does not have; the bash cases run.
  suite:
    name: Engine suite (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.suite != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false # one run shows every shard's failures, not the first one's
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # test_new.py compares with an older revision (68576e8), absent from a one-commit checkout
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python3 bin/forge test --jobs 4 --shard ${{ matrix.shard }}
