name: Project checks

# The engine's checks, called by ci.yml's `project` job. They run on a bare runner: no private deny
# file (config/publish-deny.txt, so lint applies the public list alone), no credentials,
# and a toy HOME that the fresh-install test builds for itself.
# Add jobs here, not in ci.yml: every job in this file is already inside "All checks". No trigger
# but workflow_call and workflow_dispatch, and no top-level `concurrency` (ci.yml owns both).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: lint
        run: python3 bin/forge lint --all
      # The second step runs even when the first fails, so one run reports both.
      - name: fresh install
        if: ${{ !cancelled() }}
        run: python3 tests/test_fresh_install.py

  # fwx, the framework imported under plugins/fwx, is the `fwx` group of `forge test` (51 test files, about four minutes);
  # `forge test` with no group leaves them out, so this job is where they run in CI. `forge test fwx` exits 1 when no test
  # file ran (and when the plugin folder is missing and a path is declared, as here) and 77 when none failed but one could
  # not run, so an empty or unarmed suite is red here, not falsely green. The two tests below can never run in CI, and are
  # declared so: each prints `EXPECTED NOT RUN` with its reason and does not turn the exit to 77. Any other test that cannot
  # run is still 77, so still red. The paths are relative to plugins/fwx, as the group lists them.
  #   tests/test_linear_live.py: asks the real Linear API and has no LINEAR_API_KEY here (a secret this job
  #     is not given).
  #   tests/test_playbooks_tree.py: reads the private workflow tree, which is not in this repository.
  fwx:
    name: fwx tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 bin/forge test fwx --expect-not-run tests/test_linear_live.py,tests/test_playbooks_tree.py

  # The engine's own suite, `python3 bin/forge test`: every tracked test_*.py but plugins/fwx's (that group is the `fwx` job above)
  # and the on-demand guard mutants, 4 files at once (the runner has 4 CPUs; 85 files: about 25 minutes one after the other, 6 to 9 at 4 at
  # once; test_run and test_switch start first, and each runs its own mutants 4 at a time).
  # Before this job the suite ran only on the owner's machine, so a pull request that broke tests/test_profiles.py showed green.
  # A test that exits 77 is a WARN `NOT RUN, NOT ARMED`: it does not fail the run, so the list is kept here, and a new
  # one is to be read in the log. Three tests run `unshare -rn` (test_write_guard, test_sync_fixture, test_relink_skills): Ubuntu 24.04
  # runners refuse that to an unprivileged user, so the first step lifts the restriction for this job's VM (only).
  # The one WARN line left, a thing this runner lacks (tests/test_new.py is armed by the full-history checkout below):
  #   tests/test_shim.py: the fish and zsh cases need those shells, which the runner does not have; the bash cases run.
  suite:
    name: Engine suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # test_new.py compares with an older revision (68576e8), absent from a one-commit checkout
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python3 bin/forge test --jobs 4
