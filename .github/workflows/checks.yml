name: Project checks

# The engine's checks, called by ci.yml's `project` job. They run on a bare runner: no private deny
# file (config/publish-deny.txt, so lint applies the public list alone), no credentials,
# and a toy HOME that the fresh-install test builds for itself.
# Add jobs here, not in ci.yml: every job in this file is already inside "All checks". No trigger
# but workflow_call and workflow_dispatch, and no top-level `concurrency` (ci.yml owns both).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: lint
        run: python3 bin/forge lint --all
      # The second step runs even when the first fails, so one run reports both.
      - name: fresh install
        if: ${{ !cancelled() }}
        run: python3 tests/test_fresh_install.py

  # fwx, the framework imported under plugins/fwx, is the `fwx` group of `forge test` (51 test files, about four minutes);
  # `forge test` with no group leaves them out, so this job is where they run in CI. `forge test fwx` exits 1 when no test
  # file ran (and when the plugin folder is missing and a path is declared, as here) and 77 when none failed but one could
  # not run, so an empty or unarmed suite is red here, not falsely green. The two tests below can never run in CI, and are
  # declared so: each prints `EXPECTED NOT RUN` with its reason and does not turn the exit to 77. Any other test that cannot
  # run is still 77, so still red. The paths are relative to plugins/fwx, as the group lists them.
  #   tests/test_linear_live.py: asks the real Linear API and has no LINEAR_API_KEY here (a secret this job
  #     is not given).
  #   tests/test_playbooks_tree.py: reads the private workflow tree, which is not in this repository.
  fwx:
    name: fwx tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 bin/forge test fwx --expect-not-run tests/test_linear_live.py,tests/test_playbooks_tree.py
