version: 2
# Shape copied from Kaneo (.github/dependabot.yml, MIT).
#
# Adapted: the kit's `uv` ecosystem is dropped, because this repo has no pyproject.toml or uv.lock
# for Dependabot to read and the entry would only error. Add one back with the first dependency.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Minor and patch together, majors one by one.
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
