<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>what forge writes</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="forge.css">
<style>.stage{width:1280px;height:560px}
.row{position:absolute;height:72px;border-top:1px solid var(--rule);padding-top:14px}
.row .p{font:700 14px/1 "Commit Mono";color:var(--ink);font-variant-ligatures:none}
.row .d{margin-top:10px;font:400 14px/1.3 "Inter";color:var(--ink2);white-space:nowrap}
.row .t{position:absolute;right:20px;top:14px;font:400 13px/1 "Commit Mono";color:var(--ink2)}
.cmd{position:absolute;padding:16px 18px;background:var(--ink);color:var(--ground)}
.cmd .p{font:700 18px/1 "Commit Mono"}
.cmd .d{margin-top:10px;font:400 14px/1.4 "Inter";color:color-mix(in oklch,var(--ground) 78%,var(--ink))}
</style></head><body>
<div class="stage">
  <div class="title" style="position:absolute;left:64px;top:40px">What forge writes<i></i></div>
  <div class="sub" style="position:absolute;left:64px;top:82px">You edit the sources. Every run rewrites the outputs, so a hand edit there is lost.</div>
  <div class="cap" style="position:absolute;left:64px;top:132px">you write, in the checkout</div>
  <div class="cap" style="position:absolute;left:512px;top:132px">forge runs</div>
  <div class="cap" style="position:absolute;left:832px;top:132px">forge writes</div>
  <div id="g"></div>
  <svg class="links" width="1280" height="560" viewBox="0 0 1280 560" id="links"></svg>
  <div class="rule" style="left:64px;right:64px;top:492px;border-top-width:1px"></div>
  <div class="code" style="position:absolute;left:64px;top:508px"><b>forge doctor</b>  <span style="font-family:Inter">checks both sides: one PASS, FAIL or SKIP line per check, and the command that fixes a FAIL.</span></div>
</div>
<script>
const g=document.getElementById("g"), put=(x,y,w,h,cls,html)=>{const d=document.createElement("div");d.className=cls;Object.assign(d.style,{left:x+"px",top:y+"px",width:w+"px",height:h?h+"px":""});d.innerHTML=html;g.appendChild(d)};
const Y=152, H=84;
const S=[["config/profiles/&lt;name&gt;.claude.json","one per project: servers, skills, permissions, env",""],
         ["config/mcp-registry.json","one entry per MCP server, a secret as ${VAR}",""],
         ["credentials/secrets.json","the only place real tokens live","git-ignored"],
         ["skills/&lt;name&gt;/SKILL.md","your own skills","git-ignored"]];
const O=[["&lt;project&gt;/.claude/settings.local.json","which skills and plugins load, permissions, env",""],
         ["~/.claude.json","each project's MCP servers, ${VAR} resolved",""],
         ["&lt;project&gt;/.codex/config.toml","the same servers, for Codex","with Codex on"],
         ["~/.claude/skills/&lt;name&gt;","a link per skill into the checkout",""]];
S.forEach(([p,d,t],i)=>put(64,Y+i*H,384,72,"row",`<div class="p">${p}</div><div class="d">${d}</div>${t?`<div class="t">${t}</div>`:""}`));
O.forEach(([p,d,t],i)=>put(832,Y+i*H,384,72,"row",`<div style="padding-left:16px"><div class="p">${p}</div><div class="d">${d}</div></div>${t?`<div class="t" style="right:0">${t}</div>`:""}`));
const sy=Y+H+22-49, ky=Y+3*H+22-49;   // each block centred on the rows it serves
put(512,sy,256,0,"cmd",`<div class="p">forge sync</div><div class="d">per project. A SessionStart hook runs it for the project you open.</div>`);
put(512,ky,256,0,"cmd",`<div class="p">forge skills</div><div class="d">per user: online skills, the GSD runtime, the skill links.</div>`);
const svg=document.getElementById("links"),NS="http://www.w3.org/2000/svg";
const add=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e)};
// every connector sits on a pixel centre (n + .5), so a 1 px line is one crisp pixel and two lines on one row are one line
const P=v=>Math.round(v)+0.5;
const L=(x1,y1,x2,y2,mid)=>{y1=P(y1);y2=P(y2);add("path",{d:y1===y2?`M${x1} ${y1} H${x2}`:`M${x1} ${y1} H${P(mid)} V${y2} H${x2}`});add("circle",{cx:x1,cy:y1,r:3});add("circle",{cx:x2,cy:y2,r:3})};
document.fonts.ready.then(()=>{
  const cmds=g.querySelectorAll(".cmd"), ry=i=>Y+i*H+22;
  // each block is centred exactly on the row it serves: sync on the middle source row, skills on the last
  cmds[0].style.top=(ry(1)-Math.round(cmds[0].offsetHeight/2))+"px"; cmds[1].style.top=(ry(3)-Math.round(cmds[1].offsetHeight/2))+"px";
  const cs=ry(1), ck=ry(3);
  [0,1,2].forEach(i=>L(440,ry(i),512,cs,476)); L(440,ry(3),512,ck,476);
  [0,1,2].forEach(i=>L(768,cs,832,ry(i),800)); L(768,ck,832,ry(3),800);
});
</script>
</body></html>
