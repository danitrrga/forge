<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>what forge writes</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="carbon.css"><script src="data.js"></script>
<style>.stage{width:1280px;height:560px}
.col{position:absolute;top:92px;font:600 12px/1 "Plex Sans";color:var(--ink2);letter-spacing:.02em}
.f{position:absolute;padding:12px 14px;height:64px}
.f .p{font:500 13px/1 "Plex Mono";color:var(--ink)}
.f .d{margin-top:9px;font:400 12.5px/1.3 "Plex Sans";color:var(--ink2);white-space:nowrap}
.f .tag{position:absolute;right:10px;top:9px;height:20px;font-size:11px;padding:0 8px}
.tag.g{background:#e0e0e0;color:#393939}.tag.p{background:#e8daff;color:#6929c4}
.cmd{position:absolute;padding:14px 16px;background:var(--ink);color:#f4f4f4}
.cmd .p{font:500 15px/1 "Plex Mono"}
.cmd .d{margin-top:10px;font:400 12.5px/1.45 "Plex Sans";color:#c6c6c6}
.title{position:absolute;left:64px;top:26px}
.title b{display:block;font:600 22px/1 "Plex Sans"}
.title span{display:block;margin-top:7px;font:400 14px/1 "Plex Sans";color:var(--ink2)}
.doc{position:absolute;left:64px;right:64px;top:476px;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--tile);border:1px solid var(--grid)}
.doc b{font:600 14px/1 "Plex Mono"}.doc span{font:400 13px/1 "Plex Sans";color:var(--ink2)}
</style></head><body>
<div class="stage grid64" style="background-position:-1px -1px">
  <div class="title"><b>What forge writes</b><span>You edit the sources. Every run rewrites the outputs, so a hand edit there is lost.</span></div>
  <div class="col" style="left:64px">YOU WRITE, IN THE CHECKOUT</div>
  <div class="col" style="left:512px">FORGE RUNS</div>
  <div class="col" style="left:832px">FORGE WRITES</div>
  <div id="g"></div>
  <svg class="links" width="1280" height="560" viewBox="0 0 1280 560" id="links"></svg>
  <div class="doc"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#24a148"/><path d="M6 10.2l2.6 2.6L14 7.4" stroke="#fff" stroke-width="1.8" fill="none"/></svg>
    <b>forge doctor</b><span>checks both sides: one PASS, FAIL or SKIP line per check, and the command that fixes a FAIL.</span></div>
</div>
<script>
const g=document.getElementById("g"), tile=(x,y,w,html,cls)=>{const d=document.createElement("div");d.className=cls||"tile f";Object.assign(d.style,{left:x+"px",top:y+"px",width:w+"px"});d.innerHTML=html;g.appendChild(d);return d};
const S=[["config/profiles/&lt;name&gt;.claude.json","one per project: servers, skills, permissions, env",""],
         ["config/mcp-registry.json","one entry per MCP server, a secret as ${VAR}",""],
         ["credentials/secrets.json","the only place real tokens live","<span class='tag g'>git-ignored</span>"],
         ["skills/&lt;name&gt;/SKILL.md","your own skills","<span class='tag g'>git-ignored</span>"]];
S.forEach(([p,d,t],i)=>tile(64,112+i*88,384,`<div class="p">${p}</div><div class="d">${d}</div>${t}`));
tile(512,128,256,`<div class="p">forge sync</div><div class="d">per project. A SessionStart hook<br>runs it for the project you open.</div>`,"cmd");
tile(512,320,256,`<div class="p">forge skills</div><div class="d">per user: online skills, the GSD<br>runtime, the skill links.</div>`,"cmd");
const O=[["&lt;project&gt;/.claude/settings.local.json","which skills and plugins load, permissions, env",""],
         ["~/.claude.json","each project's MCP servers, ${VAR} resolved",""],
         ["&lt;project&gt;/.codex/config.toml","the same servers, for Codex","<span class='tag p'>Codex on</span>"],
         ["~/.claude/skills/&lt;name&gt;","a link per skill into the checkout",""]];
O.forEach(([p,d,t],i)=>tile(832,112+i*88,384,`<div class="p">${p}</div><div class="d">${d}</div>${t}`));
const svg=document.getElementById("links"),NS="http://www.w3.org/2000/svg";
const add=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
const L=(x1,y1,x2,y2,mid)=>{add("path",{d:`M${x1} ${y1} H${mid} V${y2} H${x2}`,fill:"none",stroke:"#d02670","stroke-width":1.5});add("circle",{cx:x1,cy:y1,r:3.5,fill:"#d02670"});add("circle",{cx:x2,cy:y2,r:3.5,fill:"#d02670"})};
// sources into sync (profiles, registry, secrets) and into skills (skills/)
[0,1,2].forEach(i=>L(448,144+i*88,512,172,480)); L(448,144+3*88,512,364,480);
// sync to the three project-side outputs, skills to the links
[0,1,2].forEach(i=>L(768,172,832,144+i*88,800)); L(768,364,832,144+3*88,800);
</script>
</body></html>
