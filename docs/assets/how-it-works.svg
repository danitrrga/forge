<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">How forge works</title>
  <desc id="d">Four sources in the forge checkout (the per-project profiles, the MCP registry, the git-ignored secrets file and the skills directory) feed forge sync, which a SessionStart hook runs for the project you open. forge sync writes each project's settings.local.json, its MCP servers in ~/.claude.json, the user-scope hooks and skill links, and optionally the Codex config. forge doctor checks the result.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#f0883e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'JetBrainsMono Nerd Font', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    .head { font-size: 14px; fill: #7d8590; letter-spacing: 2px; }
    .ttl { font-size: 18px; fill: #e6edf3; font-weight: 600; }
    .sub { font-size: 15px; fill: #9198a1; }
    .acc { fill: #f0883e; }
    .ok { fill: #3fb950; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
    .wire { fill: none; stroke: #7d8590; stroke-width: 1.4; }
  </style>

  <rect x="1" y="1" width="1198" height="598" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <!-- column heads -->
  <text class="head" x="40" y="50">SOURCES, IN THE CHECKOUT</text>
  <text class="head" x="490" y="50">GENERATOR</text>
  <text class="head" x="800" y="50">WHAT EACH PROJECT GETS</text>

  <!-- sources -->
  <rect class="box" x="40" y="72" width="380" height="92" rx="10"/>
  <text class="ttl" x="60" y="104">config/profiles/*.claude.json</text>
  <text class="sub" x="60" y="128">one per project: MCP servers, skills,</text>
  <text class="sub" x="60" y="148">plugins, permissions, env, hooks</text>

  <rect class="box" x="40" y="178" width="380" height="92" rx="10"/>
  <text class="ttl" x="60" y="210">config/mcp-registry.json</text>
  <text class="sub" x="60" y="234">one definition per MCP server,</text>
  <text class="sub" x="60" y="254">a secret written as <tspan class="acc">${VAR}</tspan></text>

  <rect class="box" x="40" y="284" width="380" height="92" rx="10"/>
  <text class="ttl" x="60" y="316">credentials/secrets.json</text>
  <text class="sub" x="60" y="340">git-ignored, the only real tokens:</text>
  <text class="sub" x="60" y="360">the value behind each <tspan class="acc">${VAR}</tspan></text>

  <rect class="box" x="40" y="390" width="380" height="92" rx="10"/>
  <text class="ttl" x="60" y="422">skills/</text>
  <text class="sub" x="60" y="446">your own, one &lt;name&gt;/SKILL.md each;</text>
  <text class="sub" x="60" y="466">the engine's git ignores them</text>

  <text class="sub" x="40" y="532">Edit the sources, never the outputs:</text>
  <text class="sub" x="40" y="554">every sync rewrites the outputs.</text>

  <!-- source wires -->
  <path class="wire" d="M420,118 C458,118 452,252 486,252" marker-end="url(#ag)"/>
  <path class="wire" d="M420,224 C458,224 452,286 486,286" marker-end="url(#ag)"/>
  <path class="wire" d="M420,330 C458,330 452,320 486,320" marker-end="url(#ag)"/>
  <path class="wire" d="M420,436 C458,436 452,354 486,354" marker-end="url(#ag)"/>

  <!-- SessionStart hook -->
  <rect class="box" x="490" y="72" width="240" height="112" rx="10"/>
  <text class="ttl" x="508" y="101">SessionStart hook</text>
  <text class="sub" x="508" y="127">forge session-start</text>
  <text class="sub" x="508" y="147">syncs the project you</text>
  <text class="sub" x="508" y="167">open; always exits 0</text>
  <path class="wire" d="M610,184 L610,214" marker-end="url(#ag)"/>

  <!-- forge sync -->
  <rect x="490" y="218" width="240" height="176" rx="10" fill="#1a1612" stroke="#f0883e" stroke-width="1.6"/>
  <text x="508" y="254" font-size="24" font-weight="700" fill="#e6edf3">forge sync<tspan class="acc">_</tspan></text>
  <text class="sub" x="508" y="278">dry-run; --apply writes</text>
  <text class="sub" x="508" y="306"><tspan class="acc">1</tspan> skill links</text>
  <text class="sub" x="508" y="328"><tspan class="acc">2</tspan> gsd runtime (if on)</text>
  <text class="sub" x="508" y="350"><tspan class="acc">3</tspan> agent config</text>
  <text class="sub" x="508" y="372"><tspan class="acc">4</tspan> system doc</text>

  <!-- output wires -->
  <path d="M730,252 C768,252 762,118 796,118" fill="none" stroke="#f0883e" stroke-width="1.4" marker-end="url(#ao)"/>
  <path d="M730,286 C768,286 762,224 796,224" fill="none" stroke="#f0883e" stroke-width="1.4" marker-end="url(#ao)"/>
  <path d="M730,320 C768,320 762,330 796,330" fill="none" stroke="#f0883e" stroke-width="1.4" marker-end="url(#ao)"/>
  <path d="M730,354 C768,354 762,436 796,436" fill="none" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ao)"/>

  <!-- outputs -->
  <rect class="box" x="800" y="72" width="360" height="92" rx="10"/>
  <text class="ttl" x="820" y="104">.claude/settings.local.json</text>
  <text class="sub" x="820" y="128">which skills and plugins load,</text>
  <text class="sub" x="820" y="148">permissions, env, hooks</text>

  <rect class="box" x="800" y="178" width="360" height="92" rx="10"/>
  <text class="ttl" x="820" y="210">~/.claude.json</text>
  <text class="sub" x="820" y="234">the project's MCP servers,</text>
  <text class="sub" x="820" y="254">each <tspan class="acc">${VAR}</tspan> resolved to its value</text>

  <rect class="box" x="800" y="284" width="360" height="92" rx="10"/>
  <text class="ttl" x="820" y="316">~/.claude/settings.json</text>
  <text class="sub" x="820" y="340">user scope: forge's hook rows,</text>
  <text class="sub" x="820" y="360">merged; ~/.claude/skills links</text>

  <rect x="800" y="390" width="360" height="92" rx="10" fill="#161b22" stroke="#484f58" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text class="ttl" x="820" y="422">.codex/config.toml</text>
  <text x="1140" y="422" font-size="13" fill="#7d8590" text-anchor="end">optional</text>
  <text class="sub" x="820" y="446">the same MCP servers, plus</text>
  <text class="sub" x="820" y="466">.agents/skills and ~/.codex/</text>

  <!-- forge doctor -->
  <path d="M1160,544 L1172,544 Q1180,544 1180,536 L1180,118" fill="none" stroke="#3fb950" stroke-width="1.4"/>
  <path d="M1180,118 L1165,118" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#ak)"/>
  <path d="M1180,224 L1165,224" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#ak)"/>
  <path d="M1180,330 L1165,330" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#ak)"/>
  <path d="M1180,436 L1165,436" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#ak)"/>
  <rect x="490" y="510" width="670" height="68" rx="10" fill="#111a14" stroke="#3fb950" stroke-width="1.4"/>
  <path d="M510,545 L517,552 L531,536" fill="none" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="544" y="552" font-size="20" font-weight="700" class="ok">forge doctor</text>
  <text class="sub" x="720" y="539">one PASS / FAIL line per check, exit 1</text>
  <text class="sub" x="720" y="561">on a FAIL; NAME: is that project current?</text>
</svg>
